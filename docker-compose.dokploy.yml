# Dokploy: runs the published images behind tracemark's own Caddy, which routes /e and /v1/traces to ingest
# and everything else to the app. Dokploy's Traefik terminates TLS in front of it.
# Create a Compose service from this repository with Compose Path ./docker-compose.dokploy.yml, set the
# variables from docs/dokploy.md in its Environment tab, and in its Domains tab point your domain at
# service `proxy`, port 80, path /. Nothing here binds a host port.
services:
  proxy:
    image: caddy:2
    volumes:
      - ./deploy/dokploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [app, ingest]
    restart: unless-stopped

  app:
    image: ghcr.io/torstendittmann/tracemark-app:${TRACEMARK_VERSION:-latest}
    pull_policy: always
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      PUBLIC_URL: https://${TRACEMARK_DOMAIN:?set TRACEMARK_DOMAIN, e.g. analytics.example.com}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-off}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: tracemark
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: tracemark
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      # Client IPs for sign-in rate limiting; Traefik and Caddy are the two proxies in front of the app.
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: 2
    volumes:
      - app-data:/data
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  ingest:
    image: ghcr.io/torstendittmann/tracemark-ingest:${TRACEMARK_VERSION:-latest}
    pull_policy: always
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN}
      APP_INTERNAL_URL: http://app:3000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: tracemark
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: tracemark
      # Client IPs for location lookups; Traefik and Caddy are the two proxies in front of ingest. IPs are never stored.
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: 2
      # Optional city database, e.g. /geoip/dbip-city-lite.mmdb (see README).
      GEOIP_DB: ${GEOIP_DB:-}
    volumes:
      # The image pre-creates /app/spill owned by the nonroot user; mounting there keeps it writable.
      - ingest-spill:/app/spill
      - ./geoip:/geoip:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: tracemark
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "tracemark", "--password", "${CLICKHOUSE_PASSWORD}", "--query", "SELECT 1"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  app-data:
  ingest-spill:
  clickhouse-data:
