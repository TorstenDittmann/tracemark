[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "tracemark-sdk"
version = "0.1.0"
description = "Python server SDK for tracemark, self-hosted product analytics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["analytics", "product-analytics", "feature-flags", "tracemark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tracemark"]

[tool.hatch.build.targets.sdist]
include = ["src/tracemark", "tests", "README.md", "pyproject.toml"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.9"
typeCheckingMode = "strict"

[tool.mypy]
strict = true
python_version = "3.9"
files = ["src"]
