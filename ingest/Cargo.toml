[package]
name = "tracemark-ingest"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Event ingest service for tracemark product analytics"
publish = false

[[bin]]
name = "tracemark-ingest"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
flate2 = "1"
hex = "0.4"
maxminddb = "0.32.0"
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde"] }
woothee = "0.13.0"

[dev-dependencies]
maxminddb-writer = "0.1.3"
tower = { version = "0.5", features = ["util"] }
