{{- if .Values.clickhouse.enabled }}
{{- $fullname := include "footprint.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-clickhouse
  labels:
    {{- include "footprint.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  serviceName: {{ $fullname }}-clickhouse
  replicas: 1
  selector:
    matchLabels:
      {{- include "footprint.selector" (dict "ctx" . "component" "clickhouse") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "footprint.selector" (dict "ctx" . "component" "clickhouse") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: clickhouse
          image: {{ include "footprint.image" (dict "ctx" . "image" .Values.clickhouse.image) }}
          imagePullPolicy: {{ .Values.clickhouse.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8123
          env:
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "footprint.clickhouseSecretName" . }}
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 20
            failureThreshold: 6
          {{- with .Values.clickhouse.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.clickhouse.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clickhouse.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clickhouse.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.clickhouse.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-clickhouse
  labels:
    {{- include "footprint.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "footprint.selector" (dict "ctx" . "component" "clickhouse") | nindent 4 }}
  ports:
    - name: http
      port: 8123
      targetPort: http
{{- end }}
