{{- /* Generated secrets survive upgrades: an existing value in the release's Secret wins. */ -}}
{{- $name := include "footprint.fullname" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $ownApp := not .Values.existingSecret -}}
{{- $ownClickhouse := not .Values.clickhouse.existingSecret -}}
{{- if or $ownApp $ownClickhouse }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "footprint.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $ownApp }}
  INTERNAL_TOKEN: {{ .Values.internalToken | b64enc | default (get $existing "INTERNAL_TOKEN") | default (randAlphaNum 48 | b64enc) | quote }}
  AUTH_SECRET: {{ .Values.authSecret | b64enc | default (get $existing "AUTH_SECRET") | default (randAlphaNum 48 | b64enc) | quote }}
  {{- end }}
  {{- if $ownClickhouse }}
  CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.password | b64enc | default (get $existing "CLICKHOUSE_PASSWORD") | default (randAlphaNum 32 | b64enc) | quote }}
  {{- end }}
{{- end }}
